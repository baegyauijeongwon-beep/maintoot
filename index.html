<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Card Maker (텍스트 가로형 V2)</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: 'Noto Serif KR', serif;
    padding: 40px;
}

.wrapper {
    max-width: 1300px;
    margin: auto;
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 40px;
}

/* 입력 패널 디자인 */
.panel {
    background: #111;
    padding: 25px;
    border: 1px solid rgba(255,255,255,.1);
    height: fit-content;
}

.panel h2 {
    margin-bottom: 20px;
    font-size: 18px;
}

input, textarea {
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    background: #1a1a1a;
    border: 1px solid rgba(255,255,255,.1);
    color: white;
    font-family: inherit;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

button {
    width: 100%;
    padding: 12px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 10px;
    font-weight: bold;
}

button:hover {
    background: #555;
}

/* 가로형 카드 본체 */
.card {
    background: #0d0d0d;
    border: 1px solid rgba(255,255,255,.15);
    width: 850px; 
    min-height: 450px;
    display: flex;
    flex-direction: column;
}

/* 정보 전체 영역 */
.content-area {
    padding: 45px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

/* 상단 헤더 (이름, 서브정보) */
.header-section {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.name {
    font-size: 46px;
    font-weight: 700;
    margin-bottom: 15px;
}

.sub-info {
    font-size: 18px;
    color: #ccc;
    letter-spacing: 1px;
}

/* 하단 2단 분할 영역 (캐릭터 정보 | 오너 정보) */
.body-section {
    display: grid;
    grid-template-columns: 1fr 1fr; 
    gap: 50px;
    flex: 1;
}

/* 각 섹션 공통 */
.sectionTitle {
    font-size: 14px;
    opacity: 0.6;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.sectionText {
    line-height: 1.8;
    font-size: 15px;
    white-space: pre-wrap;
    color: #ddd;
}

/* 성격 키워드 태그 스타일 */
.tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px; /* 캐릭터 설명 텍스트와의 간격 */
}

.tag {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.15);
    padding: 5px 12px;
    font-size: 13px;
    color: #eee;
}

/* 모바일 화면 대응 */
@media(max-width: 1200px) {
    .wrapper { grid-template-columns: 1fr; }
    .card { width: 100%; }
    .body-section { grid-template-columns: 1fr; gap: 30px; }
}
</style>
</head>
<body>

<div class="wrapper">

    <div class="panel">
        <h2>캐릭터 입력</h2>
        
        <input id="nameInput" placeholder="이름 (예: 해리 포터)">
        <input id="ageInput" placeholder="나이 (숫자만 입력해도 '세'가 붙습니다)">
        <input id="heightInput" placeholder="키 (숫자만 입력해도 'cm'가 붙습니다)">
        <input id="houseInput" placeholder="기숙사 (예: 그리핀도르)">
        
        <input id="keyword1" placeholder="성격 키워드 1">
        <input id="keyword2" placeholder="성격 키워드 2">
        <input id="keyword3" placeholder="성격 키워드 3">
        
        <textarea id="characterInfo" placeholder="캐릭터 정보 및 서사"></textarea>
        <textarea id="ownerInfo" placeholder="오너 정보 및 한마디"></textarea>
        
        <button onclick="downloadCard()">PNG 저장</button>
    </div>

    <div id="card" class="card">
        
        <div class="content-area">
            
            <div class="header-section">
                <div id="previewName" class="name">캐릭터 이름</div>
                <div class="sub-info">
                    <span id="previewAge">00세</span> / 
                    <span id="previewHeight">000cm</span> / 
                    <span id="previewHouse">기숙사</span>
                </div>
            </div>
            
            <div class="body-section">
                
                <div>
                    <div class="sectionTitle">CHARACTER INFO</div>
                    
                    <div class="tags">
                        <div id="tag1" class="tag">키워드1</div>
                        <div id="tag2" class="tag">키워드2</div>
                        <div id="tag3" class="tag">키워드3</div>
                    </div>
                    
                    <div id="previewCharacter" class="sectionText">캐릭터의 상세한 정보를 입력해주세요.</div>
                </div>
                
                <div>
                    <div class="sectionTitle">OWNER INFO</div>
                    <div id="previewOwner" class="sectionText">오너 정보를 입력해주세요.</div>
                </div>
                
            </div>
            
        </div>
    </div>

</div>

<script>
/**
 * 스마트 데이터 바인딩 함수
 * @param inputId 입력 창 ID
 * @param targetId 출력 영역 ID
 * @param suffix 자동으로 붙일 단위 ('세', 'cm' 등)
 * @param defaultVal 값이 없을 때 보여줄 기본 텍스트
 */
function bind(inputId, targetId, suffix = '', defaultVal = ''){
    const inputEl = document.getElementById(inputId);
    const targetEl = document.getElementById(targetId);

    inputEl.addEventListener('input', e => {
        let val = e.target.value.trim();
        
        // 입력값이 비어있으면 기본값 출력
        if(!val) {
            targetEl.textContent = defaultVal;
            return;
        }
        
        // 단위가 설정되어 있고, 입력값 끝에 해당 단위가 없을 때만 붙여줌
        if(suffix && !val.endsWith(suffix)) {
            val += suffix;
        }
        
        targetEl.textContent = val;
    });
}

// 항목별 바인딩 실행 (단위 및 기본값 세팅)
bind('nameInput', 'previewName', '', '캐릭터 이름');
bind('ageInput', 'previewAge', '세', '00세');       // '세' 자동 완성
bind('heightInput', 'previewHeight', 'cm', '000cm'); // 'cm' 자동 완성
bind('houseInput', 'previewHouse', '', '기숙사');

bind('keyword1', 'tag1', '', '키워드1');
bind('keyword2', 'tag2', '', '키워드2');
bind('keyword3', 'tag3', '', '키워드3');

bind('characterInfo', 'previewCharacter', '', '캐릭터의 상세한 정보를 입력해주세요.');
bind('ownerInfo', 'previewOwner', '', '오너 정보를 입력해주세요.');

// 이미지 다운로드 함수
async function downloadCard(){
    const card = document.getElementById('card');
    const canvas = await html2canvas(card, {
        scale: 2,
        backgroundColor: '#0d0d0d'
    });
    const link = document.createElement('a');
    link.download = 'character-card.png';
    link.href = canvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
