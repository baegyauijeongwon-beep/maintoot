<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Card Maker (해리포터 기숙사 선택형)</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff; 
    color: #222;
    font-family: 'Noto Serif KR', serif;
    padding: 40px;
}

.wrapper {
    max-width: 1400px;
    margin: auto;
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 40px;
    align-items: center;
}

/* 입력 패널 디자인 */
.panel {
    background: #111;
    padding: 25px;
    border: 1px solid rgba(0,0,0,.1);
    border-radius: 12px;
    color: white;
    height: fit-content;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.panel h2 {
    margin-bottom: 20px;
    font-size: 18px;
    letter-spacing: 1px;
}

/* 💡 select 태그 추가 및 화살표 디자인 적용 */
input, textarea, select {
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    background: #1a1a1a;
    border: 1px solid rgba(255,255,255,.1);
    color: white;
    font-family: inherit;
    border-radius: 6px;
}

/* 셀렉트 박스 화살표 커스텀 (옵션) */
select {
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 15px;
    padding-right: 30px;
}

select:invalid {
    color: #888; /* placeholder 색상처럼 보이게 */
}

select option {
    color: white;
    background: #222;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

button {
    width: 100%;
    padding: 12px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 10px;
    font-weight: bold;
    border-radius: 6px;
    transition: background 0.2s;
}

button:hover {
    background: #555;
}

.canvas-container {
    padding: 40px;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 가로형 카드 본체 */
.card {
    background: #0d0d0d; 
    color: white;
    width: 850px; 
    min-height: 450px;
    display: flex;
    flex-direction: column;
    
    border-radius: 10px; 
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); 
    overflow: hidden; 
    border: 1px solid rgba(255,255,255,0.03);
}

.content-area {
    padding: 45px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.header-section {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.name-wrapper {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 15px;
}

.eng-name {
    font-size: 15px;
    color: #888;
    letter-spacing: 3px;
    font-weight: 400;
}

.name {
    font-size: 46px;
    font-weight: 700;
    line-height: 1.1;
}

.sub-info {
    font-size: 18px;
    color: #ccc;
    letter-spacing: 1px;
}

.body-section {
    display: grid;
    grid-template-columns: 1fr 1fr; 
    gap: 50px;
    flex: 1;
}

.sectionTitle {
    font-size: 14px;
    opacity: 0.6;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.sectionText {
    line-height: 1.8;
    font-size: 15px;
    white-space: pre-wrap;
    color: #ddd;
}

.tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.tag {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.15);
    padding: 5px 12px;
    font-size: 13px;
    color: #eee;
}

@media(max-width: 1200px) {
    .wrapper { grid-template-columns: 1fr; }
    .canvas-container { padding: 10px; }
    .card { width: 100%; }
    .body-section { grid-template-columns: 1fr; gap: 30px; }
}
</style>
</head>
<body>

<div class="wrapper">

    <div class="panel">
        <h2>캐릭터 입력</h2>
        
        <input id="engNameInput" placeholder="영문 이름 (예: Harry Potter)">
        <input id="korNameInput" placeholder="한글 이름 (예: 해리 포터)">
        
        <input id="ageInput" placeholder="나이">
        <input id="heightInput" placeholder="키">
        
        <select id="houseInput" required>
            <option value="" disabled selected hidden>기숙사 선택 (배정식 전까지는 배정 전을 선택해주세요)</option>
            <option value="그리핀도르">그리핀도르</option>
            <option value="래번클로">래번클로</option>
            <option value="후플푸프">후플푸프</option>
            <option value="슬리데린">슬리데린</option>
            <option value="기숙사 배정 전">기숙사 배정 전</option>
        </select>
        
        <input id="keyword1" placeholder="성격 키워드 1">
        <input id="keyword2" placeholder="성격 키워드 2">
        <input id="keyword3" placeholder="성격 키워드 3">
        
        <textarea id="characterInfo" placeholder="캐릭터 정보 및 서사"></textarea>
        <textarea id="ownerInfo" placeholder="오너 정보"></textarea>
        
        <button onclick="downloadCard()">PNG 저장</button>
    </div>

    <div id="captureArea" class="canvas-container">
        <div id="card" class="card">
            
            <div class="content-area">
                
                <div class="header-section">
                    <div class="name-wrapper">
                        <div id="previewEngName" class="eng-name">ENGLISH NAME</div>
                        <div id="previewKorName" class="name">캐릭터 이름</div>
                    </div>
                    
                    <div class="sub-info">
                        <span id="previewAge">00세</span> / 
                        <span id="previewHeight">000cm</span><span id="houseArea"> / <span id="previewHouse">기숙사</span></span>
                        </div>
                </div>
                
                <div class="body-section">
                    
                    <div>
                        <div class="sectionTitle">CHARACTER INFO</div>
                        
                        <div class="tags">
                            <div id="tag1" class="tag">키워드1</div>
                            <div id="tag2" class="tag">키워드2</div>
                            <div id="tag3" class="tag">키워드3</div>
                        </div>
                        
                        <div id="previewCharacter" class="sectionText">캐릭터의 상세한 정보를 입력해주세요.</div>
                    </div>
                    
                    <div>
                        <div class="sectionTitle">OWNER INFO</div>
                        <div id="previewOwner" class="sectionText">오너 정보를 입력해주세요.</div>
                    </div>
                    
                </div>
                
            </div>
        </div>
    </div>

</div>

<script>
function bind(inputId, targetId, suffix = '', defaultVal = ''){
    const inputEl = document.getElementById(inputId);
    const targetEl = document.getElementById(targetId);

    inputEl.addEventListener('input', e => {
        let val = e.target.value.trim();
        
        if(!val) {
            targetEl.textContent = defaultVal;
            return;
        }
        
        if(suffix && !val.endsWith(suffix)) {
            val += suffix;
        }
        
        targetEl.textContent = val;
    });
}

bind('engNameInput', 'previewEngName', '', 'ENGLISH NAME');
bind('korNameInput', 'previewKorName', '', '캐릭터 이름');

bind('ageInput', 'previewAge', '세', '00세');       
bind('heightInput', 'previewHeight', 'cm', '000cm'); 

// 💡 기숙사 전용 스크립트 (
