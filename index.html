<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>백야의 정원 메인툿</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/font-kopub@1.0">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>



<style>
    
@font-face {
    font-family: 'NexonLv1Gothic';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv1 Gothic OTF Light.woff') format('woff');
    font-weight: 300;
    font-display: swap;
}

@font-face {
    font-family: 'NexonLv1Gothic';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv1 Gothic OTF.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}

@font-face {
    font-family: 'NexonLv1Gothic';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv1 Gothic OTF Bold.woff') format('woff');
    font-weight: 700;
    font-display: swap;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff; 
    color: #222;
    font-family: 'Noto Serif KR', serif;
    padding: 40px;
}

.wrapper {
    max-width: 1400px;
    margin: auto;
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 40px;
    align-items: center;
}

/* 입력 패널 디자인 */
.panel {
    background: #e8e8e8;
    padding: 25px;
    border: 1px solid #1650be;
    border-radius: 12px;
    color: #1650be;
    height: fit-content;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.panel h2 {
    margin-bottom: 20px;
    font-size: 18px;
    letter-spacing: 1px;
}

/* select 태그 추가 및 화살표 디자인 적용 */
input, textarea, select {
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    background: #1651be2d;
    border: 1px solid #1650be;
    color: #161616;
    font-family: inherit;
    border-radius: 6px;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: #1650be;
    box-shadow: 0 0 0 2px rgba(22, 80, 190, 0.15);
}
/* 셀렉트 박스 화살표 커스텀 (옵션) */
select {
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 15px;
    padding-right: 30px;
}

select:invalid {
    color: #888;
}

select option {
    color: white;
    background: #1650be;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

button {
    width: 100%;
    padding: 12px;
    background: #1650be;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 10px;
    font-weight: bold;
    border-radius: 6px;
    transition: background 0.2s;
}

button:hover {
    background: #0a2558;
}

.canvas-container {
    padding: 40px;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 가로형 카드 본체 */
.card {
    position: relative;
    background: #e8e8e8;
    width: 850px;
    min-height: 450px;
    overflow: hidden;
    border-radius: 10px;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 180px;
    background: url("AixkBrT.png") top center / 100% auto no-repeat;
    z-index: 0;
    pointer-events: none;
    color: #161616;
}

.card::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 180px;
    background: url("KOvmc6p.png") bottom center / 100% auto no-repeat;
    z-index: 0;
    pointer-events: none;
}

.content-area {
    position: relative;
    z-index: 1;
}

.content-area {
    padding: 45px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.header-section {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #1650be;
}

.name-wrapper {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 15px;
}

.eng-name {
    font-size: 15px;
    color: #606060;
    letter-spacing: 3px;
    font-weight: 400;
}

.name {
    font-size: 46px;
    font-weight: 700;
    line-height: 1.1;
    color: #1650be;
}

.sub-info {
    font-size: 18px;
    color: #373738;
    letter-spacing: 1px;
}

.body-section {
    display: grid;
    grid-template-columns: 1fr 1fr; 
    gap: 50px;
    flex: 1;
    color: #373737;
}

.sectionTitle {
    font-size: 14px;
    opacity: 0.6;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.sectionText {
    line-height: 1.8;
    font-size: 15px;
    white-space: pre-wrap;
    color: #373738;
}

.tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.tag {
    background: rgba(255,255,255,.03);
    border: 1px solid #1650be;
    padding: 5px 12px;
    font-size: 13px;
    color: #1650be;
}

.footer-credit {
    position: absolute;
    left: 50%;
    bottom: 15px;      /* 이 값으로 위치 조절 */
    transform: translateX(-50%);

    z-index: 1;

    font-size: 10px;
    letter-spacing: -0.3px;
    color: #1650be;
}

.house-logo {
    position: absolute;
    top: 35px;
    right: 40px;
    width: 60px;
    height: auto;
    z-index: 2;
    display: none;
    pointer-events: none;
}

.footp {

}


/* 모바일 화면 대응 */
@media(max-width: 1200px) {
    .wrapper { grid-template-columns: 1fr; }
    .canvas-container { padding: 10px; }
    .card { width: 100%; }
    .body-section { grid-template-columns: 1fr; gap: 30px; }
}
</style>
</head>
<body>

<div class="wrapper">
    <div class="panel">
        <h2>캐릭터 입력</h2>
        
        <input id="engNameInput" placeholder="영문 이름 (예: Harry Potter)">
        <input id="korNameInput" placeholder="한글 이름 (예: 해리 포터)">
        
        <input id="ageInput" placeholder="나이">
        <input id="heightInput" placeholder="키">
        
        <select id="houseInput" required>
            <option value="" disabled selected hidden>기숙사 선택</option>
            <option value="그리핀도르">그리핀도르</option>
            <option value="래번클로">래번클로</option>
            <option value="후플푸프">후플푸프</option>
            <option value="슬리데린">슬리데린</option>
            <option value="기숙사 배정 전">기숙사 배정 전</option>
        </select>
        
        <input id="keyword1" placeholder="성격 키워드 1">
        <input id="keyword2" placeholder="성격 키워드 2">
        <input id="keyword3" placeholder="성격 키워드 3">
        
        <textarea id="characterInfo" placeholder="캐릭터 정보 및 서사"></textarea>
        <textarea id="ownerInfo" placeholder="오너 정보 및 한마디"></textarea>
        
        <select id="fontSelect" required>
            <option value="" disabled selected hidden>폰트 선택</option>
            <option value="'Noto Serif KR', serif">노토 세리프</option>
            <option value="'KoPub Dotum'">KoPub 돋움</option>
            <option value="'KoPub Batang'">KoPub 명조</option>
            <option value="'NexonLv1Gothic'">넥슨 Lv.1 고딕</option>
        </select>
        
        <button onclick="downloadCard()">PNG 저장</button>
    </div>

    <div id="captureArea" class="canvas-container">
        <div id="card" class="card">
            <img id="houseLogo" class="house-logo" src="" alt="">
            
            <div class="content-area">
                
                <div class="header-section">
                    <div class="name-wrapper">
                        <div id="previewEngName" class="eng-name">ENGLISH NAME</div>
                        <div id="previewKorName" class="name">캐릭터 이름</div>
                    </div>
                    
                    <div class="sub-info">
                        <span id="previewAge">00세</span> / 
                        <span id="previewHeight">000cm</span><span id="houseArea"> / <span id="previewHouse">기숙사</span></span>
                        </div>
                </div>
                
                <div class="body-section">
                    
                    <div>
                        <div class="sectionTitle">CHARACTER INFO</div>
                        
                        <div class="tags">
                            <div id="tag1" class="tag">키워드1</div>
                            <div id="tag2" class="tag">키워드2</div>
                            <div id="tag3" class="tag">키워드3</div>
                        </div>
                        
                        <div id="previewCharacter" class="sectionText">캐릭터의 상세한 정보를 입력해주세요.</div>
                    </div>
                    
                    <div>
                        <div class="sectionTitle">OWNER INFO</div>
                        <div id="previewOwner" class="sectionText">오너 정보를 입력해주세요.</div>
                    </div>
                    
                </div>
                
            </div>
            <div class="footer-credit" id="footerCredit">
                ⓒ 2026 백야의 정원 All Rights Reserved.
            </div>
        </div>
    </div>

</div>

<script>
// 💡 스페이스바를 누를 때 텍스트가 안 보이는 현상을 수정한 버전입니다!
function bind(inputId, targetId, suffix = '', defaultVal = ''){
    const inputEl = document.getElementById(inputId);
    const targetEl = document.getElementById(targetId);

    inputEl.addEventListener('input', e => {
        let val = e.target.value; // 입력값을 그대로 가져와서 띄어쓰기를 살림
        
        if(val.trim() === '') {
            targetEl.textContent = defaultVal;
            return;
        }
        
        if(suffix && !val.trim().endsWith(suffix)) {
            val += suffix;
        }
        
        targetEl.textContent = val;
    });
}

bind('engNameInput', 'previewEngName', '', 'ENGLISH NAME');
bind('korNameInput', 'previewKorName', '', '캐릭터 이름');

bind('ageInput', 'previewAge', '세', '00세');       
bind('heightInput', 'previewHeight', 'cm', '000cm'); 


// 폰트 스크립트    
document.getElementById("fontSelect").addEventListener("change", function () {
    document.getElementById("card").style.fontFamily = this.value;
});

// 기숙사 전용 스크립트 (슬래쉬 숨김 처리 로직)
document.getElementById('houseInput').addEventListener('change', function(e) {
    const val = e.target.value;
    const houseArea = document.getElementById('houseArea');
    const previewHouse = document.getElementById('previewHouse');
    const houseLogo = document.getElementById('houseLogo');

    const houseLogos = {
        '그리핀도르': 'gryffindor.png',
        '래번클로': 'ravenclaw.png',
        '후플푸프': 'hufflepuff.png',
        '슬리데린': 'slytherin.png'
    };

    if(val === '기숙사 배정 전') {
        houseArea.style.display = 'none';
        houseLogo.style.display = 'none';
        houseLogo.removeAttribute('src');
    } else {
        houseArea.style.display = 'inline';
        previewHouse.textContent = val;

        houseLogo.src = houseLogos[val];
        houseLogo.style.display = 'block';
    }
});

bind('keyword1', 'tag1', '', '키워드1');
bind('keyword2', 'tag2', '', '키워드2');
bind('keyword3', 'tag3', '', '키워드3');

bind('characterInfo', 'previewCharacter', '', '캐릭터의 상세한 정보를 입력해주세요.');
bind('ownerInfo', 'previewOwner', '', '오너 정보를 입력해주세요.');

// 💡 모바일 환경에서도 강제로 PC버전(가로형)으로 저장되도록 하는 캡처 로직
async function downloadCard(){
    const captureArea = document.getElementById('captureArea');
    
    const canvas = await html2canvas(captureArea, {
        scale: 2,
        backgroundColor: null, 
        useCORS: true,
        windowWidth: 1400, // 캡처할 때 브라우저 가로 크기를 1400px(PC 해상도)로 속임
        onclone: function(clonedDoc) {
            // 모바일 CSS가 덮어씌워지는 것을 방지하고 강제로 가로폭과 2단 그리드를 유지
            const clonedCard = clonedDoc.getElementById('card');
            const clonedBodySection = clonedDoc.querySelector('.body-section');
            
            if(clonedCard) {
                clonedCard.style.width = '850px';
            }
            if(clonedBodySection) {
                clonedBodySection.style.gridTemplateColumns = '1fr 1fr';
                clonedBodySection.style.gap = '50px';
            }
        }
    });
    
    const link = document.createElement('a');
    link.download = 'character-card.png';
    link.href = canvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
